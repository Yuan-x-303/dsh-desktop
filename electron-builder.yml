appId: com.dsh.desktop
productName: DSH Desktop
copyright: Copyright © 2026 DSH_Yuan

# Where the app checks for updates (baked into the packaged app as app-update.yml).
# Replace owner/repo with your real GitHub repo before publishing.
publish:
  provider: github
  owner: Yuan-x-303
  repo: dsh-desktop

directories:
  output: release
  buildResources: build

# Use the locally installed Electron dist (node_modules/electron/dist) instead of
# re-downloading it; speeds up builds and avoids a network/cache dependency.
electronDist: node_modules/electron/dist

# dsh runs under a real Node (see scripts/fetch-node.mjs), so node_modules must
# be plain files it can read — not packed inside app.asar.
asar: false

# Native modules (koffi) ship prebuilt binaries; do not rebuild for Electron.
npmRebuild: false

files:
  - "**/*"
  - "!src/**"
  - "!scripts/**"
  - "!resources/**"
  - "!build/**"
  - "!release/**"
  - "!*.md"
  - "!start.bat"
  - "!config.json"
  - "!config.example.json"
  - "!tsconfig.json"
  - "!.gitignore"
  - "!electron-builder.yml"
  - "!**/*.map"

extraResources:
  - from: resources/runtime/node.exe
    to: runtime/node.exe

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  artifactName: ${productName}-${version}-setup.${ext}
  # Recreates desktop/Start Menu shortcuts with the current exe icon on every
  # install (fresh or upgrade) so upgraded .lnk files never show a stale icon.
  include: build/installer.nsh

portable:
  artifactName: ${productName}-${version}-portable.${ext}
